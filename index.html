s:`#include <iostream>

q:"Nhập một năm. In YES nếu là năm nhuận, ngược lại in NO. (Năm nhuận: chia hết cho 400, hoặc chia hết cho 4 nhưng không chia hết cho 100.)",io:"Nhập: 2024 → YES\nNhập: 1900 → NO",h:"Điều kiện: (n % 400 == 0) || (n % 4 == 0 && n % 100 != 0).",
s:`#include <iostream>

s:`#include <iostream>

int timMax(int a[], int n) {
    int m = a[0];
    for (int i = 1; i < n; i++)
        if (a[i] > m) m = a[i];

    return 0;
}`}];

[["Lệnh cout làm gì?","cout đưa dữ liệu ra màn hình. Toán tử << giống một mũi tên chỉ hướng dữ liệu đi vào cout. endl kết thúc dòng hiện tại và xuống dòng mới."],["Chữ và số khác nhau thế nào?","Chữ nằm trong ngoặc kép (\"Xin chao\") được in nguyên văn. Số hoặc phép tính không có ngoặc kép (2 + 3) sẽ được máy tính ra kết quả trước rồi mới in."],["Chương trình bắt đầu từ đâu?","Máy luôn chạy các lệnh trong hàm main, từ trên xuống dưới. Dòng #include <iostream> mượn thư viện để dùng được cout. Mỗi lệnh kết thúc bằng dấu chấm phẩy ;"]],
[["cin làm gì?","Chương trình dừng lại, chờ bạn gõ dữ liệu rồi nhấn Enter. Toán tử >> đưa giá trị bạn gõ vào biến đứng phía sau."],["Phải khai báo biến trước","Biến là ô nhớ có kiểu. Muốn viết cin >> a thì phải có sẵn int a;. Kiểu của biến quyết định cách đọc: int đọc số nguyên, double đọc số thực, string đọc một từ."],["Đọc nhiều giá trị","cin >> a >> b đọc lần lượt hai giá trị, cách nhau bằng dấu cách hoặc xuống dòng. Muốn đọc cả dòng có dấu cách, dùng getline(cin, s)."]],
[["Biến là gì?","Hãy hình dung biến như một chiếc hộp có dán nhãn. Tên biến là nhãn, giá trị là thứ nằm trong hộp. Câu lệnh int tuoi = 18; tạo hộp kiểu số nguyên tên tuoi và bỏ số 18 vào."],["Vì sao phải có kiểu?","C++ cần biết hộp chứa loại gì để cấp đủ chỗ: int cho số nguyên, double cho số thực, char cho một ký tự, bool cho đúng/sai, string cho chuỗi. Kiểu quyết định phép toán nào dùng được."],["Dấu = trong C++","Dấu = là phép gán: lấy giá trị bên phải bỏ vào biến bên trái. Vì vậy tuoi = tuoi + 1; hợp lệ. Muốn so sánh bằng nhau thì dùng ==."],["Hằng số","Từ khóa const tạo ra giá trị cố định, không được sửa sau khi gán, ví dụ const double PI = 3.14159;"]],
[["Bốn phép tính quen thuộc","+, - và * hoạt động như trong toán học. Phép / phụ thuộc vào kiểu: chia hai số nguyên cho kết quả nguyên (17 / 5 = 3), chia số thực cho kết quả thực."],["Chia lấy dư","Khi chia 17 cho 5: chia được 3 lần và còn dư 2. Phép / cho số lần chia được (3), phép % cho phần dư (2). % chỉ dùng cho số nguyên và rất hay dùng để kiểm tra chẵn lẻ, tách chữ số."],["Muốn kết quả có phần lẻ","Ép một số thành số thực trước khi chia: (double)a / b cho 3.4. Hoặc viết 17.0 / 5."],["Thứ tự thực hiện","Nhân, chia, chia dư làm trước; cộng, trừ làm sau. Muốn đổi thứ tự thì dùng ngoặc tròn: (2 + 3) * 4 = 20."]],
[["Điều kiện là gì?","Điều kiện là một câu hỏi chỉ có hai câu trả lời: Đúng hoặc Sai, ví dụ diem >= 8. Máy so sánh rồi cho ra đúng hoặc sai."],["Nếu điều kiện đúng thì làm gì?","Nếu điều kiện trong ngoặc sau if đúng, máy thực hiện các lệnh nằm trong cặp ngoặc nhọn { } của if, rồi bỏ qua tất cả các nhánh còn lại (else if, else)."],["Nếu điều kiện sai thì sao?","Nếu điều kiện sai, máy bỏ qua khối { } của if và chuyển xuống kiểm tra else if tiếp theo. Nếu mọi điều kiện đều sai, máy thực hiện khối else (else không có điều kiện)."],["Máy xét từ trên xuống","Các nhánh được xét lần lượt từ trên xuống. Nhánh đầu tiên có điều kiện đúng sẽ chạy, những nhánh bên dưới không được xét nữa. Vì vậy phải xét mức cao nhất trước (>= 8 rồi mới đến >= 5)."],["Ghép điều kiện","&& nghĩa là và (cả hai cùng đúng), || nghĩa là hoặc (một trong hai đúng), ! là phủ định. Ví dụ x >= 5 && x <= 10 kiểm tra x nằm trong đoạn từ 5 đến 10."]],
[["Vòng lặp để làm gì?","Khi một việc phải làm nhiều lần, thay vì viết lệnh lặp đi lặp lại, ta dùng for để máy tự lặp."],["Ba phần trong ngoặc của for","for (int i = 1; i <= 5; i++) gồm: khởi tạo (i bắt đầu bằng 1), điều kiện (còn i <= 5 thì còn lặp), bước nhảy (sau mỗi lượt i tăng thêm 1)."],["Cách cộng dồn","Đặt tong = 0 trước vòng lặp. Mỗi lượt cộng thêm i vào tong. Khi điều kiện sai, vòng lặp dừng và máy chạy tiếp lệnh nằm sau vòng lặp."]],

var KW="int|long|double|char|bool|string|void|const|if|else|for|while|return|true|false|using|namespace|include";
var RX=new RegExp("(//.*)|(\"[^\"]*\"|'[^']*')|(\\b(?:"+KW+")\\b)|(\\b\\d+(?:\\.\\d+)?\\b)","g");
function hl(s){s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return s.replace(RX,function(m,a,b,c){return '<span class="'+(a?"c":b?"s":c?"k":"n")+'">'+m+'</span>'})}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function full(s){return s.charAt(0)=="#"?s:"#include <iostream>\nusing namespace std;\n\n"+s}
var $=function(i){return document.getElementById(i)};
var st=null;try{st=window.localStorage}catch(e){}
function ld(k){try{return st&&st.getItem(k)||""}catch(e){return ""}}
function sv(k,v){try{st&&st.setItem(k,v)}catch(e){}}

/* ===== Giao diện học ===== */
var part=1,cur=0,ex=0;
function pk(i){return (i>5?"cpp2-pg":"cpp-pg")+i}
function pg(i){return Math.min(10,+ld(pk(i))||0)}
function nav(){$("nav").innerHTML=T.map(function(x,i){var on=i==cur;
return '<button data-i="'+i+'" class="text-left whitespace-nowrap lg:whitespace-normal px-3 py-2.5 rounded-xl text-sm font-medium transition-all flex items-center justify-between gap-2 '+(on?"gradient-main text-white shadow-md":"text-neutral-700 hover:bg-blue-50")+'"><span>'+(i+1)+'. '+x.t+'</span>'+(part==2?'<span class="text-xs px-1.5 py-0.5 rounded-full '+(on?"bg-white/25":pg(i)==10?"bg-green-100 text-green-700":"bg-neutral-100 text-neutral-500")+'">'+pg(i)+'/10</span>':'')+'</button>'}).join("");
$("t1").className="px-5 py-2.5 rounded-xl font-semibold transition-all "+(part==1?"gradient-main text-white shadow-md":"bg-white text-neutral-700 border border-neutral-200 hover:border-primary/50");
$("t2").className="px-5 py-2.5 rounded-xl font-semibold transition-all "+(part==2?"gradient-main text-white shadow-md":"bg-white text-neutral-700 border border-neutral-200 hover:border-primary/50")}
function H(icon,t){return '<h3 class="font-bold text-lg mt-7 mb-2 flex items-center gap-2 text-neutral-800"><i class="fa '+icon+' text-primary"></i>'+t+'</h3>'}
function show(){var x=T[cur],h='<h2 class="text-2xl md:text-3xl font-bold mb-3"><span class="gradient-text">'+x.t+'</span></h2>',e=null;
if(part==1){x.d.forEach(function(p){h+='<p class="mb-3 leading-relaxed text-neutral-700 max-w-prose">'+esc(p)+'</p>'});
h+=H("fa-lightbulb-o","Giải thích chi tiết")+"<div class='box box-q' style='margin-top:0'>"+G[cur].map(function(g){return "<div style='margin-bottom:12px'><b>"+esc(g[0])+"</b><p class='leading-relaxed text-neutral-700'>"+esc(g[1])+"</p></div>"}).join("")+"</div>";
h+=H("fa-code","Code ví dụ")+"<pre><code>"+hl(x.c)+"</code></pre>"+H("fa-terminal","Kết quả khi chạy")+"<div class='out'></div>";
h+=H("fa-play-circle","Máy chạy ví dụ như thế nào?")+"<ol class='list-decimal pl-6 space-y-1 text-neutral-700'>"+TR[cur].map(function(t){return "<li>"+esc(t)+"</li>"}).join("")+"</ol>";
h+=H("fa-list-ol","Giải thích từng dòng")+"<ol class='wk'>"+W[cur].map(function(w){return "<li><code>"+esc(w[0])+"</code>"+esc(w[1])+"</li>"}).join("")+"</ol>";
h+="<div class='box box-a'><b><i class='fa fa-exclamation-triangle mr-1'></i> Lỗi thường gặp</b><ul>"+M[cur].map(function(r){return "<li>"+esc(r)+"</li>"}).join("")+"</ul></div>";
h+="<div class='box box-g'><b><i class='fa fa-bookmark mr-1'></i> Cần nhớ</b><ul>"+x.r.map(function(r){return "<li>"+esc(r)+"</li>"}).join("")+"</ul></div>";
h+='<div class="mt-6"><button class="btn btn-p" data-part="2"><i class="fa fa-pencil mr-2"></i>Làm 10 bài tập chủ đề này</button></div>';
}else{var p=pg(cur);e=E[cur][ex];
h+='<div class="flex flex-wrap gap-2 mb-3" role="tablist" aria-label="Danh sách bài tập">';
for(var i=0;i<10;i++)h+='<button class="chip'+(i==ex?" on":"")+(i<p?" dn":"")+'" data-e="'+i+'"'+(i>p?" disabled":"")+' title="'+(i>p?"Hoàn thành bài trước để mở":"Bài "+(i+1))+'">'+(i<p?'<i class="fa fa-check"></i> ':i>p?'<i class="fa fa-lock text-xs"></i> ':"")+(i+1)+'</button>';
h+='</div><div class="pbar"><i style="width:'+p*10+'%"></i></div>';
h+=H("fa-question-circle","Bài "+(ex+1)+"/10 – Đề bài")+"<div class='box box-q' style='margin-top:0'>"+esc(e[0])+"</div>"+H("fa-terminal","Ví dụ")+"<div class='out'></div>";
h+="<details class='dt'><summary><i class='fa fa-lightbulb-o text-amber-500 mr-2'></i>Gợi ý cách giải</summary><p class='mt-2 text-neutral-700'>"+esc(e[2])+"</p></details>";
h+=H("fa-code","Khu vực viết code C++")+"<textarea id='ed' class='ed' spellcheck='false' aria-label='Viết code C++' placeholder='// Viết code của bạn ở đây'></textarea>";
h+='<div class="flex flex-wrap gap-2 mt-3"><button class="btn" id="rs"><i class="fa fa-eraser mr-2"></i>Xóa code</button></div>';
h+='';
h+="<details class='dt'><summary><i class='fa fa-eye text-primary mr-2'></i>Xem lời giải tham khảo</summary><pre><code>"+hl(full(e[3]))+"</code></pre><p class='text-neutral-700'><b>Giải thích:</b> "+esc(X[cur][ex])+"</p></details>";
h+='<div class="mt-5"><button class="btn btn-ok" id="fin">'+(ex<9?"Tôi đã làm xong, sang bài "+(ex+2)+' <i class="fa fa-arrow-right ml-1"></i>':'Hoàn thành bài cuối <i class="fa fa-flag-checkered ml-1"></i>')+'</button></div>';
if(p>=10)h+='<div class="box box-g"><b><i class="fa fa-trophy mr-1"></i> Bạn đã hoàn thành cả 10 bài của chủ đề này!</b>'+(cur<T.length-1?'<div class="mt-3"><button class="btn btn-p" data-nt="1">Sang chủ đề '+(cur+2)+': '+esc(T[cur+1].t)+'</button></div>':'<p class="mt-1">Bạn đã đi hết các chủ đề. Chúc mừng!</p>')+'</div>';
h+='<p class="text-sm text-neutral-500 mt-4">Trang không chạy code trực tiếp. Hãy chép code vào máy để biên dịch và chạy thử, đối chiếu với ví dụ, rồi bấm nút xong để sang bài tiếp theo.</p>'}
var m=$("main");m.innerHTML=h;
var o=m.querySelector(".out");if(o)o.textContent=part==1?x.o:e[1];
var ed=$("ed");
if(ed){var key=(cur>5?"cpp2-ex":"cpp-ex")+cur+"-"+ex;ed.value=ld(key);ed.oninput=function(){sv(key,ed.value)};
ed.onkeydown=function(ev){if(ev.key=="Tab"){ev.preventDefault();ed.setRangeText("    ",ed.selectionStart,ed.selectionEnd,"end");sv(key,ed.value)}};
$("rs").onclick=function(){ed.value="";sv(key,"");ed.focus()}}
nav();try{history.replaceState(null,"","#p"+part+"b"+(cur+1)+(part==2?"e"+(ex+1):""))}catch(er){}}
document.addEventListener("click",function(ev){var t=ev.target;
var b=t.closest("[data-i],[data-part],[data-e],[data-nt],#t1,#t2,#fin");if(!b||b.disabled)return;
if(b.id=="t1")part=1;
else if(b.id=="t2"){part=2;ex=Math.min(pg(cur),9)}
else if(b.dataset.part){part=2;ex=Math.min(pg(cur),9)}
else if(b.dataset.i){cur=+b.dataset.i;ex=Math.min(pg(cur),9)}
else if(b.dataset.e)ex=+b.dataset.e;
else if(b.dataset.nt){cur++;ex=Math.min(pg(cur),9)}
else if(b.id=="fin"){if(pg(cur)<=ex)sv(pk(cur),String(ex+1));if(ex<9)ex++}
show();if(!t.closest("#nav"))window.scrollTo({top:0,behavior:"smooth"})});
try{var mm=/p(\d)b(\d+)(?:e(\d+))?/.exec(location.hash);if(mm&&T[mm[2]-1]){part=+mm[1]==2?2:1;cur=mm[2]-1;if(part==2)ex=Math.min(pg(cur),(+mm[3]||1)-1,9)}}catch(er){}
show();
